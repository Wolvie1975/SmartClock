[package]
name = "smart-clock"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ai = { version = "0.1.0", path = "../ai" }
anyhow = "1.0.104"
chrono = "0.4.45"
clock-core = { version = "0.1.0", path = "../clock-core" }
cpal = "0.18.2"
futures = "0.3.34"
google = { version = "0.1.0", path = "../google" }
news = { version = "0.1.0", path = "../news" }
oo7 = "0.7.1"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "6.3.0"

[build-dependencies]
slint-build = "1.18.1"
