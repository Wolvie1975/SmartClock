[package]
name = "smart-clock"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clock-core = { version = "0.1.0", path = "../clock-core" }
cpal = "0.18.2"
slint = "1.18.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = "6.3.0"

[build-dependencies]
slint-build = "1.18.1"
